{% extends 'base.html' %}

{% block title %}Список деталей{% endblock %}

{% block content %}
<h1 class="mb-4">Список запчастин / деталей</h1>

<ul class="list-group">
    {% for detail in details %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {{ detail.name }}
            <span class="badge bg-primary rounded-pill">{{ detail.car.title }}</span>
        </li>
    {% empty %}
        <li class="list-group-item">Деталей немає.</li>
    {% endfor %}
</ul>
{% endblock %}
