{% extends 'base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h1 class="card-title">{{ post.title }}</h1>
        <p class="text-muted">Автор: {{ post.author.username }} | Автомобіль: {{ post.car.title }}</p>
        <hr>
        <p class="card-text">{{ post.content }}</p>
        <a href="{% url 'posts:list' %}" class="btn btn-secondary">Назад до списку</a>
    </div>
</div>
{% endblock %}
