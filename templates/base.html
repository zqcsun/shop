<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мій Авто Портал{% endblock %}</title>
    <!-- Виправлено URL для Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'post_list' %}">AutoApp</a>
            <div class="collapse navbar-collapse">
                <!-- Виправлено клас на navbar-nav -->
                <ul class="navbar-nav me-auto d-flex gap-3 list-unstyled mb-0">
                    <li class="nav-item"><a class="nav-link text-white" href="{% url 'post_list' %}">Пости</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="{% url 'post_create' %}">Створити пост</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
